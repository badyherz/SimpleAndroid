name: ERICards Collector

on:
  push:
    branches: [main]
    paths:
      - "ERICards_Collector/**"
      - ".github/workflows/ericards-collector.yml"
    tags:
      - "ERICards-Collector-v*"
  pull_request:
    paths:
      - "ERICards_Collector/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: ERICards_Collector

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is moving to a newer image
    permissions:
      contents: write # needed to attach the APK to a release
    env:
      # Signing secrets (see ERICards_Collector/docs/releasing.md). Without them only a debug APK is built.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        shell: bash
        run: |
          PREFIX="ERICards-Collector-v"
          if [[ "$GITHUB_REF" == refs/tags/${PREFIX}* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the tag matches versionName (release only)
        if: steps.version.outputs.is_release == 'true'
        shell: bash
        run: |
          APP_VERSION=$(grep -E 'versionName *=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$APP_VERSION" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::The tag says ${{ steps.version.outputs.name }}, but versionName in app/build.gradle.kts is $APP_VERSION. Fix the version, commit, and create the tag again."
            exit 1
          fi

      - name: Check that the signing key is available (release only)
        if: steps.version.outputs.is_release == 'true' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::A release needs the signing secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
          exit 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease

      - name: Build a debug APK (no signing key configured)
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleDebug

      - name: Name the APK and write its checksum
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/ERICards-Collector-${{ steps.version.outputs.name }}.apk"
          else
            cp app/build/outputs/apk/debug/*.apk "dist/ERICards-Collector-${{ steps.version.outputs.name }}-debug.apk"
          fi
          cd dist
          for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done
          cat ./*.sha256

      - name: Verify the APK signature
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner was not found, the signature was not checked."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs dist/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ERICards-Collector-apk
          path: |
            ERICards_Collector/dist/*.apk
            ERICards_Collector/dist/*.sha256

      - name: Publish the GitHub release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ERICards Collector v${{ steps.version.outputs.name }}
          files: |
            ERICards_Collector/dist/*.apk
            ERICards_Collector/dist/*.sha256
          generate_release_notes: true
          body: |
            Android 13 or newer. Download the `.apk` file on your phone and open it.
            Android asks once to allow installing apps from your browser or file manager.

            The app contains no ERICards database. Load your database file in **Settings > Update Database...** after installing.
            The `.sha256` file lets you check that the download is intact.
